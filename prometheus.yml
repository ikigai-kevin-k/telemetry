global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "zcam-temperature-alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - kevin-telemetry-alertmanager:9093

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'

    # metrics_path defaults to '/metrics'
    # scheme defaults to 'http'.

    static_configs:
      - targets: ['localhost:9090']

  # Example job for scraping metrics from a Node Exporter
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['localhost:9100']

  # Example job for scraping metrics from a custom application
  # - job_name: 'myapp'
  #   static_configs:
  #     - targets: ['localhost:8080']

  # Studio Web Player metrics
  - job_name: 'studio-web-player'
    static_configs:
      - targets: ['192.168.20.9:8080']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # Pushgateway metrics
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']
    scrape_interval: 15s

  # Telegraf ZCAM HTTP Response metrics
  - job_name: 'telegraf-zcam'
    static_configs:
      - targets: ['100.64.0.178:9273']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # ZCAM Values Exporter metrics (Server-side)
  - job_name: 'zcam-values'
    static_configs:
      - targets: ['100.64.0.178:9274']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # ZCAM Values Exporter metrics (Agent-side: GC-ARO-001-2)
  - job_name: 'zcam-values-aro12'
    static_configs:
      - targets: ['100.64.0.178:9274']
        labels:
          site: 'aro12'
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # ZCAM Values Exporter metrics (Agent-side: GC-ARO-001-2)
  - job_name: 'zcam-values-aro12'
    static_configs:
      - targets: ['100.64.0.149:9274']  # GC-ARO-001-2-agent (ARO12)
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s

  # eBPF Exporter metrics (CPU, Temperature, Network Speed)
  - job_name: 'ebpf-exporter'
    static_configs:
      - targets: ['192.168.20.9:9300']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Disk Usage Exporter metrics - Monitor local server disk usage
  # Note: Using host IP (192.168.88.180) since disk-usage-exporter uses host network mode
  - job_name: 'disk-usage'
    static_configs:
      - targets: ['192.168.88.180:9275']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 10s
