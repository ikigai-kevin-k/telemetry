version: '3.8'

# Agent Mode - Run on 100.64.0.149 (GC-aro12-agent)
# This compose file runs: Loki Agent (Promtail), Zabbix Agent

services:
  # Loki Agent (Promtail) - Collects logs and sends to remote Loki server
  promtail:
    image: grafana/promtail:latest
    container_name: telemetry-promtail-GC-aro12-agent
    volumes:
      - ./promtail-GC-aro12-agent.yml:/etc/promtail/config.yml
      - ./mock_sicbo.log:/var/log/mock_sicbo.log
      - ./server.log:/var/log/server.log  # Additional log file
      - ./tmux-client-3638382.log:/var/log/tmux-client.log  # Additional log file
      - ./sdp.log:/var/log/sdp.log  # SDP error logs
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    networks:
      - monitoring

  # Zabbix Agent - Connects to remote Zabbix server
  zabbix-agent:
    image: zabbix/zabbix-agent2:ubuntu-6.0-latest
    container_name: telemetry-zabbix-agent-GC-aro12-agent
    ports:
      - "10050:10050"
    environment:
      - ZBX_HOSTNAME=GC-aro12-agent
      - ZBX_SERVER_HOST=100.64.0.182  # Ubuntu telemetry server (see telemetry-ubuntu-linux-settings.md, SERVER_IP)
      - ZBX_SERVER_ACTIVE=100.64.0.182
      - ZBX_SERVER_PORT=10051
      - ZBX_ENABLEPERSISTENTBUFFER=1
    volumes:
      - ./zabbix/agent2-GC-aro12-agent.conf:/etc/zabbix/zabbix_agent2.conf
      - ./zabbix/scripts:/var/lib/zabbix/scripts
    restart: unless-stopped
    networks:
      - monitoring

  # ZCAM Values Exporter - Exports ZCAM device metrics to Prometheus
  # ZCAM Values Exporter - Exports ARO12 ZCAM device metrics to Prometheus
  # Agent-side specific: only monitors ARO12 device at 192.168.88.12
  zcam-values-exporter:
    image: python:3.11-alpine
    container_name: kevin-telemetry-zcam-values-exporter
    restart: unless-stopped
    working_dir: /app
    command: sh -c "pip install prometheus-client requests && python zcam-values-exporter-aro12-agent.py"
    volumes:
      - ./scripts/zcam-values-exporter-aro12-agent.py:/app/zcam-values-exporter-aro12-agent.py:ro
    ports:
      - "9274:9274"  # Prometheus metrics endpoint
    networks:
      - monitoring

networks:
  monitoring:
    driver: bridge
