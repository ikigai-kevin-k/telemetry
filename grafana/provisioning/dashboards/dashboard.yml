apiVersion: 1

providers:
  # Zabbix monitoring dashboards
  - name: 'zabbix-dashboards'
    orgId: 1
    folder: 'Zabbix'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/zabbix
      
  # ZCAM monitoring dashboards
  - name: 'zcam-dashboards'
    orgId: 1
    folder: 'ZCAM'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/zcam
      
  # Loki monitoring dashboards
  - name: 'loki-dashboards'
    orgId: 1
    folder: 'loki'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/loki
      
  # General dashboards (System Overview, SDP Log, Development)
  - name: 'general-dashboards'
    orgId: 1
    folder: 'General'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/general
      
  # BytePlus monitoring dashboards
  - name: 'byteplus-dashboards'
    orgId: 1
    folder: 'BytePlus'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/byteplus
      